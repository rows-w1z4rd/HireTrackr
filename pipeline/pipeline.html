<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HireTrackr — Pipeline</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="pipeline.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">HireTrackr</div>
      <span id="last-updated" class="subtle"></span>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title">Pipeline</h1>

    <div class="stats" id="stats"></div>

    <div class="section-head">
      <h2 class="section-title">Board</h2>
      <span class="subtle">Drag a card to change its stage</span>
    </div>
    <div class="kanban" id="kanban"></div>

    <div class="section-head">
      <h2 class="section-title">Recent activity</h2>
    </div>
    <div class="recent-list" id="recent"></div>
  </main>

  <!-- Edit modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-job-title">
      <div class="modal-header">
        <div class="modal-heading" id="modal-job-title">Job details</div>
        <button id="modal-close" class="btn btn-icon" aria-label="Close">✕</button>
      </div>

      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label for="m-title">Job title</label>
            <input id="m-title" type="text" placeholder="Senior Designer" />
          </div>
          <div class="field">
            <label for="m-company">Company</label>
            <input id="m-company" type="text" placeholder="Stripe" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="m-status">Status</label>
            <select id="m-status">
              <option value="saved">Saved</option>
              <option value="applied">Applied</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="field">
            <label for="m-cv">CV attached</label>
            <select id="m-cv"><option value="">— None —</option></select>
          </div>
        </div>
        <div class="field">
          <label for="m-emailed">Emailed recruiter?</label>
          <select id="m-emailed">
            <option value="false">Not yet</option>
            <option value="true">Yes, emailed</option>
          </select>
        </div>
        <div class="field">
          <label for="m-notes">Notes</label>
          <textarea id="m-notes" placeholder="Interview format, salary, contact, referral source..."></textarea>
        </div>
        <div class="field">
          <label>Link</label>
          <div class="url-row">
            <span id="m-url-display" class="url-text"></span>
            <button id="modal-open-url" class="btn btn-small btn-tinted">Open</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="modal-delete" class="btn btn-plain btn-danger">Delete job</button>
        <div class="footer-right">
          <button id="modal-cancel" class="btn">Cancel</button>
          <button id="modal-save" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../storage.js"></script>
  <script src="pipeline.js"></script>
</body>
</html>
